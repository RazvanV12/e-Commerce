apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: ecommerce-api:local
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/ecommerce_api
            - name: SPRING_DATASOURCE_USERNAME
              value: ecommerce_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: ecommerce_pass
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: api-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
