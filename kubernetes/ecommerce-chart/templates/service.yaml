{{- range $key, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $svc.appLabel }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  selector:
    app: {{ $svc.appLabel }}
  ports:
    - name: {{ $svc.portName | default "http" }}
      port: {{ $svc.port }}
      targetPort: {{ $svc.targetPort }}
      {{- if eq ($svc.type | default "ClusterIP") "NodePort" }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
---
{{- end }}
{{- end }}
