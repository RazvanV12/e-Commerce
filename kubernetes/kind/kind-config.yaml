kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Ingress entrypoint
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

      - containerPort: 30083
        hostPort: 30083
        protocol: TCP
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
