apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
        - name: portainer
          image: portainer/portainer-ce:2.19.5
          ports:
            - containerPort: 9000